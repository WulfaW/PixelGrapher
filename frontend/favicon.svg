<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="secondary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- GitHub contribution grid inspired design -->
  <!-- Simulating a pixel art graph with ascending bars -->
  
  <!-- Row 1 - Short bars (background) -->
  <rect x="3" y="23" width="3" height="3" rx="0.5" fill="url(#primary)" opacity="0.3"/>
  <rect x="7" y="23" width="3" height="3" rx="0.5" fill="url(#primary)" opacity="0.3"/>
  
  <!-- Row 2 - Medium bars -->
  <rect x="3" y="18" width="3" height="8" rx="0.5" fill="url(#primary)" opacity="0.5"/>
  <rect x="7" y="18" width="3" height="8" rx="0.5" fill="url(#secondary)" opacity="0.6"/>
  <rect x="11" y="20" width="3" height="6" rx="0.5" fill="url(#primary)" opacity="0.4"/>
  
  <!-- Row 3 - Tall bars (creating upward trend) -->
  <rect x="11" y="13" width="3" height="13" rx="0.5" fill="url(#secondary)" opacity="0.7"/>
  <rect x="15" y="10" width="3" height="16" rx="0.5" fill="url(#secondary)" opacity="0.8" filter="url(#glow)"/>
  <rect x="19" y="7" width="3" height="19" rx="0.5" fill="url(#primary)" opacity="0.9" filter="url(#glow)"/>
  
  <!-- Row 4 - Tallest bars (peak) -->
  <rect x="23" y="4" width="3" height="22" rx="0.5" fill="url(#secondary)" opacity="1" filter="url(#glow)"/>
  <rect x="27" y="6" width="3" height="20" rx="0.5" fill="url(#primary)" opacity="0.85"/>
  
  <!-- Accent pixels for detail -->
  <circle cx="5" cy="16" r="1" fill="#60a5fa" opacity="0.6"/>
  <circle cx="9" cy="13" r="1" fill="#60a5fa" opacity="0.7"/>
  <circle cx="13" cy="9" r="1" fill="#60a5fa" opacity="0.8"/>
  <circle cx="17" cy="6" r="1" fill="#93c5fd" opacity="0.9"/>
  <circle cx="21" cy="3" r="1.2" fill="#93c5fd" opacity="1" filter="url(#glow)"/>
  
  <!-- Subtle grid lines for pixel art effect -->
  <line x1="2" y1="28" x2="30" y2="28" stroke="#60a5fa" stroke-width="0.3" opacity="0.2"/>
</svg>
