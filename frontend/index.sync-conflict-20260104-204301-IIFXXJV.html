<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, user-scalable=yes" />
    <title>PixelGrapher - GitHub Contribution Graph Art Generator</title>
    <meta name="description" content="Transform your creative ideas into stunning GitHub contribution patterns. Draw ASCII art, use AI text-to-pattern, or choose from templates to paint your GitHub profile." />
    
    <!-- SEO Meta Tags -->
    <meta name="keywords" content="GitHub, contribution graph, ASCII art, commit art, GitHub profile, developer tools, git commits, github pattern, profile art" />
    <meta name="author" content="PixelGrapher" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#22c55e" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="PixelGrapher - GitHub Contribution Graph Art Generator" />
    <meta property="og:description" content="Transform your creative ideas into stunning GitHub contribution patterns. Draw ASCII art, use AI text-to-pattern, or choose from templates." />
    <meta property="og:site_name" content="PixelGrapher" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PixelGrapher - GitHub Contribution Graph Art Generator" />
    <meta name="twitter:description" content="Transform your creative ideas into stunning GitHub contribution patterns." />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    
    <!-- Fonts - Preload for better performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Performance hints -->
    <link rel="dns-prefetch" href="https://api.github.com" />
    
    <!-- Initialize theme before page load to prevent flash -->
    <script>
      const theme = localStorage.getItem('theme') || 'dark';
      if (theme === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
