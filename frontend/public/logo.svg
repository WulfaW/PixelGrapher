<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" fill="none">
  <defs>
    <linearGradient id="primary-logo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="secondary-logo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <filter id="glow-logo">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Logo icon - Pixel art canvas inspired -->
  <g transform="translate(5, 8)">
    <!-- Ascending bars representing growth -->
    <rect x="0" y="20" width="3" height="4" rx="0.5" fill="url(#primary-logo)" opacity="0.4"/>
    <rect x="4" y="18" width="3" height="6" rx="0.5" fill="url(#primary-logo)" opacity="0.5"/>
    <rect x="8" y="15" width="3" height="9" rx="0.5" fill="url(#secondary-logo)" opacity="0.7"/>
    <rect x="12" y="11" width="3" height="13" rx="0.5" fill="url(#secondary-logo)" opacity="0.85" filter="url(#glow-logo)"/>
    <rect x="16" y="6" width="3" height="18" rx="0.5" fill="url(#primary-logo)" opacity="1" filter="url(#glow-logo)"/>
    
    <!-- Accent dots -->
    <circle cx="2" cy="18" r="0.8" fill="#34d399" opacity="0.6"/>
    <circle cx="6" cy="14" r="0.8" fill="#34d399" opacity="0.7"/>
    <circle cx="10" cy="10" r="0.8" fill="#6ee7b7" opacity="0.8"/>
    <circle cx="14" cy="6" r="1" fill="#6ee7b7" opacity="0.9" filter="url(#glow-logo)"/>
    <circle cx="18" cy="2" r="1.2" fill="#6ee7b7" opacity="1" filter="url(#glow-logo)"/>
  </g>
  
  <!-- Text -->
  <g transform="translate(35, 0)">
    <text x="0" y="20" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="url(#primary-logo)">
      Pixel
    </text>
    <text x="0" y="33" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" fill="url(#primary-logo)" opacity="0.8">
      Grapher
    </text>
  </g>
</svg>
