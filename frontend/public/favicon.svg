<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <style>
      .pixel { fill-rule: evenodd; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="32" height="32" fill="#f8f9fa" rx="4"/>
  
  <!-- Grid pattern (pixel art canvas) -->
  <!-- Row 1 -->
  <rect x="4" y="4" width="3" height="3" fill="#8b5cf6"/>
  <rect x="8" y="4" width="3" height="3" fill="#8b5cf6"/>
  <rect x="20" y="4" width="3" height="3" fill="#ec4899"/>
  <rect x="24" y="4" width="3" height="3" fill="#ec4899"/>
  
  <!-- Row 2 -->
  <rect x="4" y="8" width="3" height="3" fill="#06b6d4"/>
  <rect x="12" y="8" width="3" height="3" fill="#10b981"/>
  <rect x="16" y="8" width="3" height="3" fill="#10b981"/>
  <rect x="24" y="8" width="3" height="3" fill="#ec4899"/>
  
  <!-- Row 3 -->
  <rect x="4" y="12" width="3" height="3" fill="#06b6d4"/>
  <rect x="8" y="12" width="3" height="3" fill="#06b6d4"/>
  <rect x="12" y="12" width="3" height="3" fill="#10b981"/>
  <rect x="16" y="12" width="3" height="3" fill="#10b981"/>
  <rect x="20" y="12" width="3" height="3" fill="#f59e0b"/>
  <rect x="24" y="12" width="3" height="3" fill="#f59e0b"/>
  
  <!-- Row 4 -->
  <rect x="4" y="16" width="3" height="3" fill="#3b82f6"/>
  <rect x="12" y="16" width="3" height="3" fill="#10b981"/>
  <rect x="20" y="16" width="3" height="3" fill="#f59e0b"/>
  <rect x="24" y="16" width="3" height="3" fill="#f59e0b"/>
  
  <!-- Row 5 -->
  <rect x="8" y="20" width="3" height="3" fill="#3b82f6"/>
  <rect x="12" y="20" width="3" height="3" fill="#3b82f6"/>
  <rect x="20" y="20" width="3" height="3" fill="#3b82f6"/>
  <rect x="24" y="20" width="3" height="3" fill="#3b82f6"/>
  
  <!-- Row 6 -->
  <rect x="8" y="24" width="3" height="3" fill="#8b5cf6"/>
  <rect x="12" y="24" width="3" height="3" fill="#8b5cf6"/>
  <rect x="20" y="24" width="3" height="3" fill="#8b5cf6"/>
  <rect x="24" y="24" width="3" height="3" fill="#8b5cf6"/>
</svg>
