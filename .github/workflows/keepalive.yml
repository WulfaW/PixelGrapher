name: Keep Backend Alive

on:
  schedule:
    # Runs every 14 minutes to prevent Render from sleeping (which happens after 15 mins)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend
        run: |
          # Replace with your actual Render backend URL if different
          curl -s https://pixelgrapher.onrender.com/health > /dev/null
          echo "Pinged backend to keep it awake!"
